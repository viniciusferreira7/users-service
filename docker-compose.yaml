services:
  users-service-postgresql:
    container_name: users-service-postgresql
    image: postgres:15.19
    ports:
      - ${DATABASE_PORT:-5435}:5432
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - users-service-network
    volumes:
      - users_service_pg_data:/var/lib/postgresql/data

  users-service-postgresql-test:
    container_name: users-service-postgresql-test
    image: postgres:15.19
    profiles:
      - test
    ports:
      - ${DATABASE_TEST_PORT:-5436}:5432
    environment:
      POSTGRES_USER: ${DATABASE_TEST_USERNAME:-test}
      POSTGRES_PASSWORD: ${DATABASE_TEST_PASSWORD:-test}
      POSTGRES_DB: ${DATABASE_TEST_NAME:-users_db_test}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_TEST_USERNAME:-test} -d ${DATABASE_TEST_NAME:-users_db_test}",
        ]
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - users-service-network

networks:
  users-service-network:
    driver: bridge

volumes:
  users_service_pg_data:
